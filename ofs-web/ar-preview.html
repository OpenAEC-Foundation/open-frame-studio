<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFS AR Preview</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="./blueprint.css">
</head>
<body>
    <header class="header">
        <img src="./blueprint/icon.png" alt="" width="20" height="20">
        <h1>AR Preview — Open Frame Studio</h1>
    </header>

    <main class="ar-layout">
        <div class="ar-canvas">
            <model-viewer
                id="viewer"
                alt="Kozijn 3D preview"
                shadow-intensity="1"
                camera-controls
                touch-action="pan-y"
                auto-rotate
                ar
                ar-modes="webxr scene-viewer quick-look"
                poster=""
            >
                <button slot="ar-button" class="ar-btn">
                    Bekijk in AR
                </button>
            </model-viewer>
            <p id="model-hint">Laad een .glb bestand via de URL parameter: <code>?model=pad/naar/kozijn.glb</code></p>
        </div>

        <section class="panel info">
            <h2>Kozijn K01</h2>
            <dl>
                <dt>Type</dt><dd>Draaikiepraam</dd>
                <dt>Afmetingen</dt><dd>1200 × 1500 mm</dd>
                <dt>Materiaal</dt><dd>Meranti 67 × 114 mm</dd>
                <dt>Beglazing</dt><dd>HR++ 4-16-4 (Ug 1.0)</dd>
                <dt>Kleur</dt><dd>RAL 9010 / RAL 9010</dd>
            </dl>
        </section>
    </main>

    <script>
        // Load model from URL parameter
        var params = new URLSearchParams(window.location.search);
        var modelUrl = params.get('model');
        if (modelUrl) {
            document.getElementById('model-hint').hidden = true;
            document.getElementById('viewer').setAttribute('src', modelUrl);
        }
    </script>
</body>
</html>
