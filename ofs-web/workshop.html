<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFS Werkvloer</title>
    <link rel="stylesheet" href="./blueprint.css">
</head>
<body>
    <header class="header">
        <img src="./blueprint/icon.png" alt="" width="20" height="20">
        <h1>OFS Werkvloer</h1>
        <span class="version">v2026.48.4</span>
    </header>
    <nav class="tabs" aria-label="Werkvloer">
        <button class="tab" aria-pressed="true" aria-controls="tab-scan" onclick="showTab('scan', this)">Scan</button>
        <button class="tab" aria-pressed="false" aria-controls="tab-jobs" onclick="showTab('jobs', this)">Opdrachten</button>
        <button class="tab" aria-pressed="false" aria-controls="tab-checklist" onclick="showTab('checklist', this)">Checklist</button>
    </nav>
    <main class="workshop-content">
        <div id="tab-scan" class="scan-area">
            <p class="scan-prompt">Scan de QR-code op het onderdeel</p>
            <button class="scan-btn" onclick="simulateScan()">SCAN</button>
            <div id="scan-result" aria-live="polite"></div>
        </div>
        <div id="tab-jobs" hidden>
            <div class="job-list">
                <div class="job-card"><div><span class="job-mark">K01</span><div class="job-info">1200x1500mm - Meranti - Draaikiepraam</div></div><span class="job-status status-bezig">Bezig</span></div>
                <div class="job-card"><div><span class="job-mark">K02</span><div class="job-info">1800x1400mm - Meranti - Dubbel DK</div></div><span class="job-status status-wacht">Wacht</span></div>
                <div class="job-card"><div><span class="job-mark">D01</span><div class="job-info">1000x2400mm - Accoya - Voordeur</div></div><span class="job-status status-klaar">Klaar</span></div>
            </div>
        </div>
        <div id="tab-checklist" hidden>
            <h2>K01 — Productie checklist</h2>
            <div class="checklist">
                <label class="check-item"><input type="checkbox" checked><span><strong>Zagen</strong><small>4 onderdelen afgezaagd</small></span></label>
                <label class="check-item"><input type="checkbox" checked><span><strong>Bewerken</strong><small>Sponningen frezen, pennen zagen</small></span></label>
                <label class="check-item"><input type="checkbox"><span><strong>Oppervlaktebehandeling</strong><small>Gronden + 2x aflakken</small></span></label>
                <label class="check-item"><input type="checkbox"><span><strong>Assemblage</strong><small>Verlijmen, klemmen, drogen</small></span></label>
                <label class="check-item"><input type="checkbox"><span><strong>Beglazing</strong><small>HR++ 4-16-4 plaatsen</small></span></label>
                <label class="check-item"><input type="checkbox"><span><strong>Afwerking &amp; controle</strong><small>Beslag afhangen, eindcontrole</small></span></label>
            </div>
        </div>
    </main>
    <script>
        function showTab(name, btn) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => { el.hidden = el.id !== "tab-" + name; });
            document.querySelectorAll(".tab").forEach(tab => tab.setAttribute("aria-pressed", String(tab === btn)));
        }
        function simulateScan() {
            document.getElementById('scan-result').innerHTML =
                '<div class="scan-card">' +
                '<strong class="job-mark">K01-SL</strong>' +
                '<p class="job-info">Stijl Links - KVT 67x114mm</p>' +
                '<p class="scan-measures">Netto: <strong>1366mm</strong> - Bruto: <strong>1406mm</strong></p>' +
                '<p class="job-info">Verstek: 90\u00B0 / 90\u00B0 - Pen: 20mm</p>' +
                '<p class="scan-status">\u2713 Afgezaagd - \u2713 Bewerkt - \u25CB Oppervlak</p>' +
                '</div>';
        }
    </script>
</body>
</html>
