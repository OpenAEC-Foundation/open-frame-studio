name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag matching the source (e.g., v2026.46.0)'
        required: true
      prerelease:
        description: 'Publish as a beta prerelease'
        type: boolean
        required: true
        default: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install Rust stable and browser target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Match release tag and source versions
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - name: Test core
        run: cargo test -p ofs-core --lib --locked
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build browser against current core
        working-directory: ui
        run: npm run build:web

  create-release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      prerelease: ${{ steps.get-version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            # Calendar versions (JJJJ.W.N, enforced by check-version.mjs) never
            # contain a hyphen, so the old "tag contains -" test could never be
            # true and every tag push became a stable 'Latest' release without
            # the beta limits. Until a production release is agreed
            # (docs/release-readiness.md), a tag push is a beta prerelease; a
            # stable release needs an explicit workflow_dispatch with
            # prerelease=false.
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              target_commitish: context.sha,
              name: `Open Frame Studio ${version}`,
              body: `## Open Frame Studio ${version}\n\nParametric window frame design software for the construction industry.\n\n### Downloads\n- **Windows (System)**: Download the \`*_x64-setup.exe\` installer (requires admin)\n- **Windows (User)**: Download the \`*_x64_user-setup.exe\` installer (no admin required)\n- **macOS**: Download the \`.dmg\` file (universal — supports Intel and Apple Silicon)\n- **Linux**: Download the \`.deb\` package or \`.AppImage\`\n\n### Features\n- Parametric window frame design with grid editor\n- IFC / DXF / PDF / glTF export\n- Profile database (wood, PVC, aluminum)\n- Production lists & cost calculation\n- Blender/Bonsai integration\n- Multi-language (NL / EN / DE)`,
              draft: true,
              prerelease: '${{ steps.get-version.outputs.prerelease }}' === 'true'
            });
            return data.id;

      - name: Write beta release notes
        if: steps.get-version.outputs.prerelease == 'true'
        uses: actions/github-script@v8
        env:
          release_id: ${{ steps.create-release.outputs.result }}
          release_version: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const version = process.env.release_version;
            const body = [
              `# Open Frame Studio ${version}`,
              '',
              '**Bèta voor ontwerp- en BIM-uitwisselproeven. Geen productie-, CNC- of normvrijgave.**',
              '',
              '### Installers',
              '- Windows: ondertekende NSIS-installers voor het hele systeem (administrator) en voor de huidige gebruiker.',
              '- macOS: universele DMG voor Intel en Apple Silicon; deze build is nog niet genotariseerd.',
              '- Linux: DEB en AppImage.',
              '',
              '### Huidige grenzen',
              '- Gedetailleerde IFC4-uitvoer ondersteunt rechthoekige kozijnen met vaste beglazing. LOD400, bijzondere vormen, bewegende delen en vliesgevels vallen buiten deze export.',
              '- IFC, JSON en CSV voor producentenoverdracht bevatten indicatieve gegevens; import in producentensoftware en machinebewerkingen zijn niet gevalideerd.',
              '- Generieke G-code-export is geblokkeerd. CE, Bbl en SKH/KOMO zijn indicatieve voorcontroles.',
              '- Alleen een visuele Revit-linkproef is uitgevoerd; Tekla, SketchUp en hsbDesign moeten nog worden geaccepteerd.',
              '- Een installatietest op een schone machine is nog niet uitgevoerd.',
              '- De desktopapp heeft nog geen automatische updater; nieuwe versies vereisen een handmatige installer.',
              '',
              '### Licentievermelding',
              'De repository bevat een bestaand verschil tussen de CC BY-SA 4.0-tekst in LICENSE en AGPL-3.0 in Cargo/UI-metadata. Deze bèta wijzigt geen licentie; de rechthebbenden moeten dit verschil nog vastleggen.',
              '',
              `Broncode en releasecontroles: https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${version}/docs/release-readiness.md`,
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              body,
            });

      - name: Make draft discoverable by tag
        uses: actions/github-script@v8
        env:
          release_id: ${{ steps.create-release.outputs.result }}
          release_version: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            // GitHub can expose drafts as untagged-<id> after a notes update.
            // Set the tag last so gh release upload can find the draft.
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              tag_name: process.env.release_version,
            });

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'linux'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'macos'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'windows-system'
          - platform: 'windows-latest'
            args: '--bundles nsis'
            target: 'windows-user'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Set Windows install mode
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json -AsHashtable
          if ("${{ matrix.target }}" -eq "windows-system") {
            $mode = "perMachine"
          } else {
            $mode = "currentUser"
          }
          $conf['bundle']['windows'] = @{ 'nsis' = @{ 'installMode' = $mode } }
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Clear beforeBuildCommand (frontend already built)
        shell: node {0}
        run: |
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          conf.build.beforeBuildCommand = '';
          conf.build.beforeDevCommand = '';
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          console.log('Cleared beforeBuildCommand and beforeDevCommand');

      - name: Build Tauri app
        if: matrix.target != 'windows-user'
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Build Tauri app (user installer)
        if: matrix.target == 'windows-user'
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: ${{ matrix.args }}

      - name: Authenticode sign Windows exe and installer
        if: contains(matrix.target, 'windows')
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          cache-dependencies: false
          files-folder: ${{ github.workspace }}/target/release/bundle/nsis
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign main executable
        if: contains(matrix.target, 'windows')
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          cache-dependencies: false
          files-folder: ${{ github.workspace }}/target/release
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Re-upload signed system installer
        if: matrix.target == 'windows-system'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $NSIS_DIR = "target/release/bundle/nsis"
          $EXE = Get-ChildItem "$NSIS_DIR/*-setup.exe" | Select-Object -First 1
          if (-not $EXE) { throw "Windows system NSIS installer ontbreekt" }
          $signature = Get-AuthenticodeSignature -LiteralPath $EXE.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows system installer heeft geen geldige Authenticode-handtekening: $($signature.Status)"
          }
          Write-Host "Re-uploading signed installer: $($EXE.Name)"
          gh release upload $VERSION "$($EXE.FullName)" --clobber --repo "${{ github.repository }}"

      - name: Upload user installer to release
        if: matrix.target == 'windows-user'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $NSIS_DIR = "target/release/bundle/nsis"
          $EXE = Get-ChildItem "$NSIS_DIR/*-setup.exe" | Select-Object -First 1
          if (-not $EXE) { throw "Windows user NSIS installer ontbreekt" }
          $signature = Get-AuthenticodeSignature -LiteralPath $EXE.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows user installer heeft geen geldige Authenticode-handtekening: $($signature.Status)"
          }
          $NEW_NAME = $EXE.Name -replace '_x64-setup\.exe$', '_x64_user-setup.exe'
          $NEW_PATH = Join-Path $EXE.DirectoryName $NEW_NAME
          Rename-Item $EXE.FullName $NEW_PATH
          gh release upload $VERSION "$NEW_PATH" --clobber --repo "${{ github.repository }}"
          Write-Host "Uploaded user installer: $NEW_NAME"

  verify-assets:
    needs: [create-release, build]
    permissions:
      # GitHub treats assets of a draft release as write-protected resources.
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Require all installer assets before publication
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              per_page: 100,
            });
            const expected = [
              ['Windows system NSIS', /_x64-setup\.exe$/],
              ['Windows user NSIS', /_x64_user-setup\.exe$/],
              ['macOS universal DMG', /_universal\.dmg$/],
              ['Linux DEB', /\.deb$/],
              ['Linux AppImage', /\.AppImage$/],
            ];
            const missing = expected.filter(([, pattern]) => !assets.some(asset => pattern.test(asset.name) && asset.size > 0));
            if (missing.length) {
              throw new Error(`Installers ontbreken of zijn leeg: ${missing.map(([name]) => name).join(', ')}. Gevonden: ${assets.map(asset => asset.name).join(', ')}`);
            }
            core.info(`Gecontroleerde installers: ${assets.map(asset => `${asset.name} (${asset.size} bytes)`).join(', ')}`);

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, verify-assets]

    steps:
      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          release_version: ${{ needs.create-release.outputs.version }}
          release_prerelease: ${{ needs.create-release.outputs.prerelease }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: process.env.release_prerelease === 'true'
            });
