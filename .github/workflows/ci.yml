name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Test UI and 3D viewer
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ui
        run: node --test

      - name: Check candidate version labels
        run: node scripts/check-version.mjs

      - name: Build headless API and native library
        if: runner.os != 'macOS'
        run: cargo build --locked -p ofs-cloud -p ofs-sdk

      - name: Run external SDK consumer and package its ABI
        if: runner.os != 'macOS'
        run: python ofs-sdk/package.py target/debug ofs-sdk.zip

      - name: Keep the tested native SDK
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ofs-sdk-${{ runner.os }}-x64
          path: ofs-sdk.zip

      - name: Build frontend
        if: matrix.platform != 'ubuntu-22.04'
        working-directory: ui
        run: npm run build

      - name: Install browser build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build browser with current Rust core
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ui
        run: npm run build:web

      - name: Test SuperCloud Docs and MCP in a sandboxed browser
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ui
        run: |
          node --test ../packaging/mcp/stdio.test.mjs
          ./node_modules/.bin/vite build --mode platform --base ./ --outDir "$RUNNER_TEMP/ofs-platform"
          npm install --prefix "$RUNNER_TEMP/ofs-browser-test" --no-save --package-lock=false --ignore-scripts playwright-core@1.65.1
          export OFS_PLAYWRIGHT="$RUNNER_TEMP/ofs-browser-test/node_modules/playwright-core"
          export OFS_BROWSER="$(command -v google-chrome)"
          node scripts/smoke-platform.mjs "$RUNNER_TEMP/ofs-platform"

      - name: Check Rust workspace
        run: cargo check -p ofs-core -p open-frame-studio --locked

      # Zonder deze stap bood de hele ofs-core-testsuite nul CI-bescherming
      # (cargo check type-checkt geen #[cfg(test)]-code).
      - name: Test ofs-core
        run: cargo test -p ofs-core --lib --locked

      - name: Check IFC panes with Open BIM Suite
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/check-ifc-panes

      - name: Build Tauri app (no bundle)
        working-directory: src-tauri
        run: cargo build --locked

      - name: Install and start the unsigned Windows candidate on the clean runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location src-tauri
          ../ui/node_modules/.bin/tauri.cmd bundle --debug --ci --bundles nsis --no-sign --no-binary-patching
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          ./scripts/test-windows-install.ps1 -UnsignedDebugCandidate
