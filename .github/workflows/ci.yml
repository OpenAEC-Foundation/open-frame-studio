name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Check candidate version labels
        run: node scripts/check-version.mjs

      - name: Build frontend
        if: matrix.platform != 'ubuntu-22.04'
        working-directory: ui
        run: npm run build

      - name: Install browser build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build browser with current Rust core
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ui
        run: npm run build:web

      - name: Check Rust workspace
        run: cargo check -p ofs-core -p open-frame-studio --locked

      # Zonder deze stap bood de hele ofs-core-testsuite nul CI-bescherming
      # (cargo check type-checkt geen #[cfg(test)]-code).
      - name: Test ofs-core
        run: cargo test -p ofs-core --lib --locked

      - name: Generate IFC acceptance fixture
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo run -p ofs-core --example ifc_acceptance_fixture --locked -- "$RUNNER_TEMP/ofs-ifc-acceptance"
          test -s "$RUNNER_TEMP/ofs-ifc-acceptance/01-los-kozijn.ifc"
          test -s "$RUNNER_TEMP/ofs-ifc-acceptance/03-onderdelen.ifc"
          test -s "$RUNNER_TEMP/ofs-ifc-acceptance/05-onderdelen-revisie.ifc"

      - name: Build Tauri app (no bundle)
        working-directory: src-tauri
        run: cargo build --locked
